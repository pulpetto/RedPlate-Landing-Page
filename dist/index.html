<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RedPlate — chase personal records and keep pushing forward."
    />
    <meta name="theme-color" content="#090708" />
    <title>RedPlate — Chase PRs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Handjet:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="hero" aria-labelledby="app-name">
        <header class="wordmark">
          <p class="eyebrow" aria-hidden="true">EST. MMXXVI</p>
          <h1 id="app-name">RedPlate</h1>
          <p class="tagline">Chase PRs</p>
        </header>

        <div class="mascot-frame" aria-hidden="true">
          <span class="corner corner--top-left"></span>
          <span class="corner corner--top-right"></span>
          <img
            class="mascot"
            src="./assets/brick_static.png"
            width="100"
            height="100"
            alt=""
          />
          <span class="corner corner--bottom-left"></span>
          <span class="corner corner--bottom-right"></span>
        </div>

        <button class="store-button" type="button" aria-label="Download RedPlate on the App Store — coming soon">
          <svg class="apple-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.1v-.01ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z" />
          </svg>
          <span class="store-copy">
            <span class="store-kicker">Coming soon on the</span>
            <span class="store-name">App Store</span>
          </span>
        </button>
      </main>

      <footer class="footer">
        <span class="footer-label">Get in touch</span>
        <a href="mailto:support@redplate.app">support@redplate.app</a>
      </footer>
    </div>
  </body>
</html>
